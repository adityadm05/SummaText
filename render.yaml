services:
  # -------------------------------------------------------------
  # Backend: Python FastAPI Web Service (Free Tier)
  # -------------------------------------------------------------
  - type: web
    name: summatext-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -c "import nltk; nltk.download('punkt_tab'); nltk.download('stopwords')"
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"

  # -------------------------------------------------------------
  # Frontend: React Vite Static Site (Free Tier, 0ms Cold Start)
  # -------------------------------------------------------------
  - type: web
    name: summatext-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
